name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Server
        - Web client
        - Desktop (Electron)
        - TUI / CLI
        - Bot SDK
        - Documentation
        - CI / Docker
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which version or commit hash are you on?
      placeholder: "e.g., main, dev, or commit abc1234"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, Docker version, etc.
      placeholder: |
        - OS: macOS 15 / Ubuntu 24.04
        - Browser: Chrome 126
        - Node.js: 22
        - pnpm: 9
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste logs, error messages, or screenshots.
