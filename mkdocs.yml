site_name: Nexus Chat
site_description: A Slack-like IM platform with hybrid encryption — normal mode (IM + Bot) and end-to-end encrypted mode (IM only). Phase 1 complete, 25/25 tasks.
repo_url: https://github.com/immane/nexus-chat
edit_uri: edit/main/docs/
site_dir: site
site_url: https://immane.github.io/nexus-chat/
copyright: Copyright &copy; 2026 Lam K. &mdash; <a href="https://github.com/immane/nexus-chat/blob/main/LICENSE">MIT License</a>

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Readme: README.project.md
  - Quick Start: QUICKSTART.md
  - Design Documents:
      - System High-Level Architecture: design/00_System_High_Level_Architecture.md
      - Client Shell & UI Rendering: design/01_Client_Shell_and_UI_Rendering_Layer.md
      - Long Connection & Core Gateway: design/02_Long_Connection_and_Core_Gateway_Layer.md
      - Business Logic & Persistence: design/03_Business_Logic_and_Persistence_Backend.md
      - Async Bot Engine & Event Dispatch: design/04_Async_Bot_Engine_and_Event_Dispatch_Layer.md
      - AI Agent Orchestration & Streaming: design/05_AI_Agent_Orchestration_and_Streaming.md
      - Phase Roadmap: design/06_Phase_Roadmap.md
      - P2P DM Direct Connection: design/07_P2P_DM_Direct_Connection.md
      - TUI Chat Redesign: design/08_TUI_Chat_Redesign.md
      - Web Client UI Design: design/09_Web_Client_UI_Design.md
      - E2EE Encryption Abstract Layer: design/10_E2EE_Encryption_Abstract_Layer.md
      - PostgreSQL Persistence Integration: design/11_PostgreSQL_Persistence_Integration.md
      - Phase 2 Scale-Out Architecture: design/12_Phase_2_Scale_Out_Architecture.md
  - Research:
      - Frontend Architecture: research/frontend-architecture.md
      - Backend IM & State Machine: research/backend-im-state-machine.md
      - UI Components & Plugin Protocol: research/ui-components-plugin-protocol.md
      - Bot Engine & Microservices: research/bot-engine-microservices.md
      - Security Defense & E2EE: research/security-defense-e2ee-roadmap.md
      - Base Bot Catalog: research/base-bot-catalog.md
      - AI Agent Orchestration: research/ai-agent-orchestration.md
      - Telegram Interface Analysis: research/telegram-interface-analysis.md
  - Bot SDK:
      - Node.js / TypeScript: sdk/nodejs.md
      - Java: sdk/java.md
      - Python: sdk/python.md
      - PHP: sdk/php.md
      - Go: sdk/go.md
      - Rust: sdk/rust.md
  - Operations:
      - Backup & Restore: backup-restore.md
      - Beta Checklist: beta-checklist.md
      - Known Limitations: known-limitations.md
  - AI Context: ai/context.md

extra:
  alternate:
    - name: English
      link: /nexus-chat/
      lang: en
    - name: 中文
      link: /nexus-chat/zh/
      lang: zh
